<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Directory · Newmarket Community Mesh</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --blue: #024685;
      --green: #c1cf18;
      --ink: #16304a;
      --muted: #3d5166;
      --paper: #ffffff;
      --line: #e4eaf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
      line-height: 1.5;
    }
    .band { height: 8px; background: var(--blue); }
    .band + .band { height: 4px; background: var(--green); margin-top: 0; }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .place {
      display: inline-block;
      margin: 0 0 0.4rem;
      color: var(--blue);
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .place:hover { color: #01366a; }
    h1 {
      margin: 0 0 0.45rem;
      color: var(--blue);
      font-size: 2.4rem;
      font-weight: 720;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .lede { margin: 0; color: var(--ink); font-size: 1.12rem; }
    .back {
      margin: 0 0 0.35rem;
      font-size: 0.95rem;
    }
    .back a { color: var(--blue); font-weight: 650; text-decoration: none; }
    .back a:hover { color: #01366a; }
    .count { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.85rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .tile {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: inherit;
      overflow: hidden;
      text-decoration: none;
    }
    .tile:hover { border-color: #b7c6d4; }
    .stripes { height: 12px; background: var(--blue); box-shadow: inset 0 -4px 0 var(--green); }
    .sheet { padding: 0.95rem 1.05rem 1.05rem; }
    .sheet strong {
      display: block;
      color: var(--blue);
      font-size: 1.55rem;
      font-weight: 720;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .sheet .n {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .preview {
      margin-top: 0.8rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--line);
    }
    .preview b {
      display: block;
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 700;
    }
    .preview .blurb {
      display: -webkit-box;
      margin-top: 0.12rem;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 400;
      white-space: normal;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview .where {
      display: block;
      margin-top: 0.12rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hit {
      display: block;
      max-width: 40rem;
      padding: 0.95rem 0;
      border-top: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    .hit strong {
      display: block;
      color: var(--blue);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .hit .kind {
      display: block;
      margin-top: 0.1rem;
      color: #0b7a3b;
      font-size: 0.85rem;
      font-weight: 400;
    }
    .hit .body {
      display: block;
      margin-top: 0.25rem;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 400;
    }
    .hit:hover strong, .tile:hover .sheet strong { color: #01366a; }
    a:focus-visible, .tile:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }
    .none { margin: 1.25rem 0 0; color: var(--ink); font-size: 1.12rem; }
    footer {
      margin-top: 2.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--blue); font-size: 1.02rem; font-weight: 650; }
    footer a:hover { color: #01366a; }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="band"></div>
  <div class="band"></div>
  <main>
    <a class="place" id="place" href="http://127.0.0.1:8092/">Newmarket, Ontario</a>
    <p id="back" class="back" hidden><a href="/directory/">Directory</a></p>
    <h1 id="heading">Directory</h1>
    <p id="lede" class="lede">Categories the crawler found on this network.</p>
    <p id="count" class="count" hidden></p>
    <div id="grid" class="grid"></div>
    <div id="results"></div>
    <p id="none" class="none" hidden></p>
    <footer>
      <p><a href="/">Portal</a></p>
      Lab copy. Nothing here is on the public internet. No analytics.
    </footer>
  </main>
  <script>
    var onHub = location.hostname === "hub.nm" || location.hostname === "hub.nm-mesh.daddar.io";
    var host = location.protocol + "//" + location.hostname;
    document.getElementById("place").href = onHub ? "/" : host + ":8092/";

    var heading = document.getElementById("heading");
    var lede = document.getElementById("lede");
    var back = document.getElementById("back");
    var count = document.getElementById("count");
    var grid = document.getElementById("grid");
    var results = document.getElementById("results");
    var none = document.getElementById("none");
    var chosen = new URLSearchParams(location.search).get("c") || "";

    function pageUrl(page) {
      if (!page.url) return "";
      try {
        var target = new URL(page.url, location.href);
        if (target.hostname === location.hostname) return target.pathname + target.search;
        return target.href;
      } catch (error) {
        return "";
      }
    }

    function snippet(page) {
      return page.summary || page.text || "";
    }

    function pagesLabel(n) {
      return n === 1 ? "1 page" : n + " pages";
    }

    function shortUrl(page) {
      if (!page.url) return "";
      try {
        var target = new URL(page.url);
        return target.host + target.pathname + target.search;
      } catch (error) {
        return "";
      }
    }

    function showNone(message) {
      none.hidden = false;
      none.textContent = message;
    }

    function drawGrid(groups) {
      var names = Object.keys(groups).sort(function (a, b) {
        return a.localeCompare(b);
      });
      if (!names.length) {
        showNone("The crawl has not grouped any pages yet.");
        return;
      }
      names.forEach(function (name) {
        var pages = groups[name];
        var tile = document.createElement("a");
        tile.className = "tile";
        tile.href = "/directory/?c=" + encodeURIComponent(name);
        var stripes = document.createElement("div");
        stripes.className = "stripes";
        var sheet = document.createElement("div");
        sheet.className = "sheet";
        var title = document.createElement("strong");
        title.textContent = name;
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = pagesLabel(pages.length);
        sheet.appendChild(title);
        sheet.appendChild(n);
        pages.slice(0, 3).forEach(function (page) {
          var preview = document.createElement("div");
          preview.className = "preview";
          if (page.title && (pages.length > 1 || page.title !== name)) {
            var label = document.createElement("b");
            label.textContent = page.title;
            preview.appendChild(label);
          }
          var blurb = document.createElement("span");
          blurb.className = "blurb";
          blurb.textContent = snippet(page);
          var where = document.createElement("span");
          where.className = "where";
          where.textContent = shortUrl(page);
          preview.appendChild(blurb);
          if (where.textContent) preview.appendChild(where);
          sheet.appendChild(preview);
        });
        tile.appendChild(stripes);
        tile.appendChild(sheet);
        grid.appendChild(tile);
      });
    }

    function drawSerp(pages) {
      document.title = chosen + " · Directory · Newmarket Community Mesh";
      heading.textContent = chosen;
      lede.hidden = true;
      back.hidden = false;
      grid.hidden = true;
      if (!pages.length) {
        showNone("Nothing on the network is in this category.");
        return;
      }
      count.hidden = false;
      count.textContent = pagesLabel(pages.length);
      pages.forEach(function (page) {
        var url = pageUrl(page);
        var row = document.createElement(url ? "a" : "div");
        row.className = "hit";
        if (url) row.href = url;
        var title = document.createElement("strong");
        title.textContent = page.title || chosen;
        var where = document.createElement("span");
        where.className = "kind";
        where.textContent = shortUrl(page) || "This page has no address";
        var body = document.createElement("span");
        body.className = "body";
        body.textContent = snippet(page);
        row.appendChild(title);
        row.appendChild(where);
        row.appendChild(body);
        results.appendChild(row);
      });
    }

    fetch("/directory/catalog.json", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("catalog");
        return response.json();
      })
      .then(function (pages) {
        var groups = {};
        pages.forEach(function (page) {
          if (!page.category) return;
          if (!groups[page.category]) groups[page.category] = [];
          groups[page.category].push(page);
        });
        if (chosen) drawSerp(groups[chosen] || []);
        else drawGrid(groups);
      })
      .catch(function () {
        showNone("The network index is not ready.");
      });
  </script>
</body>
</html>
