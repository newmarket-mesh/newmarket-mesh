<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mesh-category" content="Search">
  <meta name="mesh-summary" content="Results for a search across this network.">
  <title>Search · Newmarket Community Mesh</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/custom.css">
  <style>
    :root {
      color-scheme: light;
      --blue: #024685;
      --green: #c1cf18;
      --ink: #16304a;
      --muted: #3d5166;
      --paper: #ffffff;
      --line: #e4eaf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
      line-height: 1.5;
    }
    .band { height: 8px; background: var(--blue); }
    .band + .band { height: 4px; background: var(--green); }
    .bar {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0.85rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    .home {
      color: var(--blue);
      font-size: 1.45rem;
      font-weight: 720;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-decoration: none;
      white-space: nowrap;
    }
    .home:hover { color: #01366a; }
    form { flex: 1; max-width: 36rem; }
    .search {
      width: 100%;
      height: 3rem;
      padding: 0 1.25rem;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
    }
    .search:focus {
      outline: 3px solid var(--green);
      outline-offset: 2px;
      border-color: var(--blue);
    }
    .tools { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
    main {
      max-width: 40rem;
      margin: 0;
      padding: 1.75rem 1.5rem 3rem 1.25rem;
    }
    .count { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.85rem; }
    .hit {
      display: block;
      padding: 0.95rem 0;
      border-top: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    .hit strong {
      display: block;
      color: var(--blue);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .hit .kind {
      display: block;
      margin-top: 0.1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .hit span.body {
      display: block;
      margin-top: 0.25rem;
      color: var(--ink);
      font-size: 1rem;
    }
    .hit:hover strong { color: #01366a; }
    .hit:focus-visible, .home:focus-visible, .apps-button:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }
    .none {
      margin: 0;
      color: var(--ink);
      font-size: 1.12rem;
    }
  </style>
</head>
<body>
  <div class="band"></div>
  <div class="band"></div>
  <header class="bar">
    <a class="home" href="/">Newmarket, Ontario</a>
    <form role="search" action="/search/" method="get">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search the network</label>
      <input class="search" id="q" name="q" type="search" placeholder="Search the network" autocomplete="off">
    </form>
    <div class="tools">
      <button id="apps-button" class="apps-button" type="button" aria-label="Apps" aria-expanded="false" aria-controls="apps-menu">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="3.5" cy="3.5" r="1.6" fill="currentColor"/>
          <circle cx="10" cy="3.5" r="1.6" fill="currentColor"/>
          <circle cx="16.5" cy="3.5" r="1.6" fill="currentColor"/>
          <circle cx="3.5" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="10" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="16.5" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="3.5" cy="16.5" r="1.6" fill="currentColor"/>
          <circle cx="10" cy="16.5" r="1.6" fill="currentColor"/>
          <circle cx="16.5" cy="16.5" r="1.6" fill="currentColor"/>
        </svg>
      </button>
      <div id="apps-menu" class="apps-menu" hidden>
        <a class="app" id="app-search" href="/">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
          Search
        </a>
        <a class="app" id="mesh-directory" href="http://127.0.0.1:8090/directory/">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
          Directory
        </a>
        <a class="app" id="app-square" href="http://127.0.0.1:8094/">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
          Square
        </a>
      </div>
    </div>
  </header>
  <main>
    <p id="none" class="none" hidden></p>
    <div id="results"></div>
  </main>
  <script src="../assets/search.js"></script>
  <script src="../assets/apps.js"></script>
</body>
</html>
